services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_time}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Hello123}
      POSTGRES_DB: ${POSTGRES_DB:-agent_time}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_time} -d ${POSTGRES_DB:-agent_time}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  market-fetcher:
    build: .
    command: ["python", "-m", "agent.fetch_markets", "--market-limit", "${AGENT_MARKET_CACHE_LIMIT:-25}", "--cache-path", "/data/shared_markets.json"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PREDICT_ARENA_MARKET_CACHE: /data/shared_markets.json
      AGENT_CONFIG_PATH: /app/agent.json
      AGENT_DISABLE_DOTENV: "1"
    volumes:
      - ./data:/data
      - ./agent.json:/app/agent.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  agent-gpt:
    build: .
    command: ["/app/scripts/run_single_agent.sh", "gpt-runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AGENT_SKIP_SCHEMA_INIT: "1"
      AGENT_DISABLE_DOTENV: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MANIFOLD_API_KEY_OPENAI: ${MANIFOLD_API_KEY_OPENAI}
      PREDICT_ARENA_MARKET_CACHE: /data/shared_markets.json
      AGENT_CONFIG_PATH: /app/agent.json
      AGENT_RESULTS_PATH: /results/gpt_runs.jsonl
      AGENT_TRADE_LOG_PATH: /results/trades.jsonl
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-2}
      AGENT_VERBOSE: "1"
      AGENT_DB_LOG: "0"
      AGENT_DB_LOG_ROWS: "0"
      AGENT_LLM_LOG: "1"
      MARKET_CACHE_WAIT_SECONDS: ${MARKET_CACHE_WAIT_SECONDS:-120}
    volumes:
      - ./data:/data
      - ./results/gpt:/results
      - ./agent.json:/app/agent.json:ro
    depends_on:
      market-fetcher:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  pg_data:
