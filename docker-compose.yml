services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_time}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Hello123}
      POSTGRES_DB: ${POSTGRES_DB:-agent_time}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./agents.json:/docker-entrypoint-initdb.d/agents.json:ro
    ports:
      - "5432:5432"

  market-fetcher:
    build: .
    command: ["python", "-m", "agent.fetch_markets", "--market-limit", "${AGENT_MARKET_CACHE_LIMIT:-25}", "--cache-path", "/data/shared_markets.json"]
    environment:
      PREDICT_ARENA_MARKET_CACHE: /data/shared_markets.json
    volumes:
      - ./data:/data
    depends_on:
      - postgres

  agent-gpt:
    build: .
    command: ["/app/scripts/run_agent.sh", "gpt-runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://agent_time:agent_time@postgres:5432/agent_time}
      AGENT_SKIP_SCHEMA_INIT: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MANIFOLD_API_KEY_OPENAI: ${MANIFOLD_API_KEY_OPENAI}
      PREDICT_ARENA_MARKET_CACHE: /data/shared_markets.json
      AGENT_CONFIG_PATH: /app/agents.json
      AGENT_RESULTS_PATH: /results/gpt_runs.jsonl
      AGENT_TRADE_LOG_PATH: /results/trades.jsonl
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-2}
      AGENT_VERBOSE: "1"
      AGENT_DB_LOG: "0"
      AGENT_DB_LOG_ROWS: "0"
      AGENT_LLM_LOG: "1"
      MARKET_CACHE_WAIT_SECONDS: ${MARKET_CACHE_WAIT_SECONDS:-120}
    volumes:
      - ./data:/data
      - ./results:/results
      - ./agents.json:/app/agents.json:ro
    depends_on:
      market-fetcher:
        condition: service_completed_successfully
      postgres:
        condition: service_started

  agent-claude:
    build: .
    command: ["/app/scripts/run_agent.sh", "claude-runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://agent_time:agent_time@postgres:5432/agent_time}
      AGENT_SKIP_SCHEMA_INIT: "1"
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      MANIFOLD_API_KEY_CLAUDE: ${MANIFOLD_API_KEY_CLAUDE}
      PREDICT_ARENA_MARKET_CACHE: /data/shared_markets.json
      AGENT_CONFIG_PATH: /app/agents.json
      AGENT_RESULTS_PATH: /results/claude_runs.jsonl
      AGENT_TRADE_LOG_PATH: /results/trades.jsonl
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-2}
      AGENT_VERBOSE: "1"
      AGENT_DB_LOG: "0"
      AGENT_DB_LOG_ROWS: "0"
      AGENT_LLM_LOG: "1"
      MARKET_CACHE_WAIT_SECONDS: ${MARKET_CACHE_WAIT_SECONDS:-120}
    volumes:
      - ./data:/data
      - ./results:/results
      - ./agents.json:/app/agents.json:ro
    depends_on:
      market-fetcher:
        condition: service_completed_successfully
      postgres:
        condition: service_started

  agent-gemini:
    build: .
    command: ["/app/scripts/run_agent.sh", "gemini-runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://agent_time:agent_time@postgres:5432/agent_time}
      AGENT_SKIP_SCHEMA_INIT: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MANIFOLD_API_KEY_GEMINI: ${MANIFOLD_API_KEY_GEMINI}
      PREDICT_ARENA_MARKET_CACHE: /data/shared_markets.json
      AGENT_CONFIG_PATH: /app/agents.json
      AGENT_RESULTS_PATH: /results/gemini_runs.jsonl
      AGENT_TRADE_LOG_PATH: /results/trades.jsonl
      AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-2}
      AGENT_VERBOSE: "1"
      AGENT_DB_LOG: "0"
      AGENT_DB_LOG_ROWS: "0"
      AGENT_LLM_LOG: "1"
      MARKET_CACHE_WAIT_SECONDS: ${MARKET_CACHE_WAIT_SECONDS:-120}
    volumes:
      - ./data:/data
      - ./results:/results
      - ./agents.json:/app/agents.json:ro
    depends_on:
      market-fetcher:
        condition: service_completed_successfully
      postgres:
        condition: service_started

volumes:
  pg_data:
